name: ContactHub CI

on:
  push:
    branches: [main, "feature/**", "v1.0.*"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      POSTGRES_TEST_DATABASE_URL: ${{ secrets.POSTGRES_TEST_DATABASE_URL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Optional isolated PostgreSQL integration tests
        if: ${{ env.POSTGRES_TEST_DATABASE_URL != '' }}
        env:
          POSTGRES_TEST_DATABASE_URL: ${{ secrets.POSTGRES_TEST_DATABASE_URL }}
          POSTGRES_TEST_CONFIRM_ISOLATED: "1"
        run: pytest -q -m postgres
      - name: Validate free Render Blueprint
        working-directory: .
        run: |
          python -m pip install PyYAML==6.0.2
          python -c "import yaml; data=yaml.safe_load(open('render.yaml', encoding='utf-8')); api, web=data['services']; assert api['plan']=='free' and 'disk' not in api; assert any(v.get('key')=='DATABASE_URL' and v.get('sync') is False for v in api['envVars']); assert web['runtime']=='static' and web['routes'][0]['destination']=='/index.html'"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

