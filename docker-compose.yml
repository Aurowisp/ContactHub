services:
  backend:
    build:
      context: .
      target: backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/contacthub.db}
    volumes:
      - contacthub_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: web
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  contacthub_data:

